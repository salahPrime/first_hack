<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instagram Login</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
      background-attachment: fixed;
    }

    .mobile-container {
      width: 100%;
      max-width: 400px;
      height: 100vh;
      max-height: 844px;
      background: linear-gradient(
        180deg, 
        rgba(253, 245, 246, 1) 0%, 
        rgba(242, 247, 253, 1) 40%, 
        rgba(235, 245, 240, 1) 100%
      );
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 40px 24px 20px 24px;
      position: relative;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
    }

    /* Top Section / Form */
    .content-wrapper {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 60px;
    }

    .logo {
      width: 64px;
      height: 64px;
      margin-bottom: 40px;
    }

    .login-form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .input-field {
      width: 100%;
      padding: 16px 18px;
      border: 1px solid #d1d5db;
      border-radius: 14px;
      background-color: rgba(255, 255, 255, 0.8);
      font-size: 15px;
      color: #1f2937;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .input-field::placeholder {
      color: #6b7280;
    }

    .input-field:focus {
      border-color: #0064e0;
      background-color: #ffffff;
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      background-color: #0064e0;
      color: #ffffff;
      border: none;
      border-radius: 25px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
      transition: background-color 0.2s ease;
    }

    .btn-login:hover {
      background-color: #0052b8;
    }

    .forgot-password {
      margin-top: 16px;
      color: #1c2b33;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
    }

    /* Bottom Section */
    .footer-wrapper {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      margin-bottom: 10px;
    }

    .btn-create-account {
      width: 100%;
      padding: 12px;
      background-color: transparent;
      color: #0064e0;
      border: 1.5px solid #0064e0;
      border-radius: 25px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      text-align: center;
      transition: background-color 0.2s ease;
    }

    .btn-create-account:hover {
      background-color: rgba(0, 100, 224, 0.05);
    }

    .meta-logo {
      display: flex;
      align-items: center;
      gap: 4px;
      color: #4b5563;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.2px;
    }

    .meta-logo svg {
      width: 20px;
      height: 20px;
      fill: #4b5563;
    }
  </style>
  <link rel="stylesheet" href="theme.css">
</head>
<body>

  <div class="mobile-container">
    <div class="content-wrapper">
      <!-- Instagram Gradient Logo -->
      <svg class="logo" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">

            <stop offset="0%" stop-color="#ffb140" />
            <stop offset="25%" stop-color="#ff543e" />
            <stop offset="50%" stop-color="#c837ab" />
            <stop offset="100%" stop-color="#7024c4" />
          </linearGradient>
        </defs>

      </svg>

      <!-- Form Inputs -->
      <form class="login-form" action="#" method="POST">
        <input 
          type="text" 
          class="input-field" 
          placeholder="Username, email or mobile number" 
          required 
        />
        <input 
          type="password" 
          class="input-field" 
          placeholder="Password" 
          required 
        />
        <button type="submit" class="btn-login">Log in</button>
      </form>

      <a href="#" class="forgot-password">Forgot password?</a>
    </div>

    <!-- Footer -->
    <div class="footer-wrapper">
      <a href="#" class="btn-create-account">Create new account</a>
      
      <div class="meta-logo">
        <svg viewBox="0 0 24 24">
          <path d="M16.465 3c-1.802 0-3.45.845-4.465 2.245C10.985 3.845 9.337 3 7.535 3 4.477 3 2 5.477 2 8.535c0 4.391 6.012 9.771 9.47 12.247.318.228.742.228 1.06 0C15.988 18.306 22 12.926 22 8.535 22 5.477 19.523 3 16.465 3z" fill="none"/>

          <path d="M12 11.5c-1.8-2.6-4.2-4.5-6.8-4.5-2.2 0-3.7 1.6-3.7 3.5 0 3.3 4.6 7.5 8.5 10.3 3.9-2.8 8.5-7 8.5-10.3 0-1.9-1.5-3.5-3.7-3.5-2.6 0-5 1.9-6.8 4.5z" fill="none"/>
          <path d="M8.2 14.5c1.8 0 3.6-.9 4.8-2.5 1.2 1.6 3 2.5 4.8 2.5 2.1 0 3.7-1.5 3.7-3.5s-1.8-3.5-3.9-3.5c-1.9 0-3.6 1.1-4.6 2.7C12 8.6 10.3 7.5 8.4 7.5 6.3 7.5 4.5 9 4.5 11s1.6 3.5 3.7 3.5z" fill="currentColor"/>
        </svg>
        Meta
      </div>
    </div>
  </div>

</body>
</html>
