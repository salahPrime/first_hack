<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Login</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/page-specific/instagram-login.css">
</head>
<body>

    <div class="mobile-container">
        <div class="top-bar center-text">
            <span class="language-selector">English (US) ▾</span>
        </div>

        <div class="main-content login-layout">
            <div class="logo-container">
                <svg width="68" height="68" viewBox="0 0 24 24" fill="none" aria-label="Instagram logo">
                    <defs>
                        <radialGradient id="ig-grad" cx="30%" cy="107%" r="150%">
                            <stop offset="0%" stop-color="#fdf497" />
                            <stop offset="5%" stop-color="#fdf497" />
                            <stop offset="45%" stop-color="#fd5949" />
                            <stop offset="60%" stop-color="#d6249f" />
                            <stop offset="90%" stop-color="#285AEB" />
                        </radialGradient>
                    </defs>
                    <rect x="2" y="2" width="20" height="20" rx="5.5" stroke="url(#ig-grad)" stroke-width="2.2"/>
                    <circle cx="12" cy="12" r="4.5" stroke="url(#ig-grad)" stroke-width="2.2"/>
                    <circle cx="17.5" cy="6.5" r="1.3" fill="url(#ig-grad)"/>
                </svg>
            </div>

            <form class="auth-form" action="#" method="POST">
                <div class="input-wrapper">
                    <input type="text" placeholder="Username, email or mobile number" required>
                    <span class="input-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8e8e8e" stroke-width="1.8" aria-hidden="true">
                            <circle cx="12" cy="8" r="4"/>
                            <path d="M5 20c0-3.5 3.1-6 7-6s7 2.5 7 6"/>
                        </svg>
                    </span>
                </div>

                <div class="input-wrapper">
                    <input type="password" placeholder="Password" required>
                    <span class="input-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8e8e8e" stroke-width="1.8" aria-hidden="true">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                            <line x1="1" y1="1" x2="23" y2="23"/>
                        </svg>
                    </span>
                </div>

                <button type="submit" class="primary-btn">Log in</button>
            </form>

            <a href="forgot-password.html" class="forgot-link">Forgot password ?</a>
        </div>

        <div class="bottom-section">
            <button type="button" class="outline-primary-btn">Create new account</button>
            <div class="meta-branding">
                <svg width="18" height="12" viewBox="0 0 24 14" fill="none" stroke="#d0d0d0" stroke-width="2" aria-hidden="true">
                    <path d="M6.5 2C3.5 2 1.5 4.2 1.5 7s2 5 5 5c2.5 0 4.2-2.2 5.5-5 1.3-2.8 3-5 5.5-5 3 0 5 2.2 5 5s-2 5-5 5c-2.5 0-4.2-2.2-5.5-5-1.3-2.8-3-5-5.5-5z"/>
                </svg>
                <span>Meta</span>
            </div>
        </div>
    </div>

</body>
</html>
