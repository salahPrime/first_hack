<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f3ed">
  <title>WhatsApp sign in · Lock Room</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color:#202c29;background:#f4f3ed}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(#d5d9cd .7px,transparent .7px) 0 0/15px 15px}.card{width:min(480px,100%);padding:36px;background:#fffefa;border:1px solid #e2e4dc;border-radius:16px;box-shadow:0 15px 45px #30413512;text-align:center}.mark{display:grid;place-items:center;width:48px;height:48px;margin:0 auto 20px;border-radius:14px;background:#2f7259;color:white;font-weight:800;font-size:24px}.eyebrow{color:#235a46;font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:12px}h1{font:400 32px Georgia;margin:12px 0}.muted{color:#64716b;line-height:1.7}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:24px}.button{background:#2f7259;color:white;padding:12px 16px;border-radius:7px;text-decoration:none;font-weight:700}.button:hover{background:#235a46}.secondary{background:#e9eee8;color:#235a46}
  </style>
</head>
<body>
  <main class="card">
    <span class="mark" aria-hidden="true">L</span>
    <p class="eyebrow">WhatsApp</p>
    <h1>Continue to WhatsApp</h1>
    <p class="muted">Sign in only on WhatsApp’s official website or app. Lock Room does not ask for or collect social media passwords or login codes.</p>
    <div class="actions">
      <a class="button" href="https://web.whatsapp.com/" target="_blank" rel="noopener noreferrer">Open official WhatsApp</a>
      <a class="button secondary" href="index.html">Back to Lock Room</a>
    </div>
  </main>
</body>
</html>
