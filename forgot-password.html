<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Your Account</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/page-specific/instagram-login.css">
</head>
<body>

    <div class="mobile-container">
        <div class="top-bar">
            <a href="insta_login.html" class="back-btn" aria-label="Go back">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
            </a>
        </div>

        <div class="main-content recovery-layout">
            <h1 class="page-title">Find your account</h1>
            <p class="subtitle">Enter your email or username.</p>
            <a href="#" class="help-link">Can't reset your password ?</a>

            <form class="auth-form" action="#" method="POST">
                <div class="input-wrapper">
                    <input type="text" placeholder="Email or username" required>
                </div>

                <button type="submit" class="primary-btn">Continue</button>
            </form>

            <a href="#" class="secondary-text-link">Find by mobile number</a>

            <div class="or-divider">
                <span class="line"></span>
                <span class="or-text">OR</span>
                <span class="line"></span>
            </div>

            <a href="facebook_login.html" class="fb-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="#ffffff" aria-hidden="true">
                    <path d="M12 2C6.477 2 2 6.477 2 12c0 4.991 3.657 9.128 8.438 9.878v-6.987h-2.54V12h2.54V9.797c0-2.506 1.492-3.89 3.777-3.89 1.094 0 2.238.195 2.238.195v2.46h-1.26c-1.243 0-1.63.771-1.63 1.562V12h2.773l-.443 2.89h-2.33v6.988C18.343 21.128 22 16.991 22 12c0-5.523-4.477-10-10-10z"/>
                </svg>
                <span>Log in with Facebook</span>
            </a>
        </div>
    </div>

</body>
</html>
