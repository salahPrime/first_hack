<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook - Log In or Sign Up</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/page-specific/facebook-login.css">
</head>
<body>

    <div class="container">
        <!-- Language Selector -->
        <div class="lang-select">
            <select>
                <option value="en">English (US)</option>
            </select>
        </div>

        <!-- Facebook Logo -->
        <div class="logo">facebook</div>

        <!-- Login Form -->
        <form>
            <input type="text" class="input-field" placeholder="Mobile number or email"[cite: 1]>
            <input type="password" class="input-field" placeholder="Password"[cite: 1]>
            <button type="submit" class="login-btn">Log in</button>
        </form>

        <!-- Forgot Password -->
        <a href="#" class="forgot-password">Forgot password?</a>
    </div>

    <!-- Create Account Button -->
    <a href="#" class="create-btn">Create new account</a>

    <!-- Watermark from image footer -->
    <div class="watermark">Coding Rukon</div>

</body>
</html>
