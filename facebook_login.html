<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in to Facebook</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/page-specific/facebook-login.css">
</head>
<body>

    <div class="login-container">
        <!-- Left Side: Branding and Artwork Showcase -->
        <div class="left-section">
            <div class="brand-logo">
                <svg viewBox="0 0 36 36" fill="#0866ff" height="36" width="36" aria-label="Facebook logo">
                    <path d="M15 358C6.716 358 0 351.284 0 343V15C0 6.716 6.716 0 15 0h328c8.284 0 15 6.716 15 15v328c0 8.284-6.716 15-15 15H15z" fill="#0866ff"/>
                    <path d="M25 23.5h-3.5V20H25v-3.5c0-3.5 2-5.5 5.5-5.5H33v4h-2c-1.1 0-1.5.4-1.5 1.5V20H33l-.5 3.5H29.5V35H25V23.5z" fill="#fff"/>
                </svg>
            </div>

            <h1 class="brand-heading">Explore the things you love.</h1>

            <!-- Decorative Graphic Mockup -->
            <div class="graphics-showcase">
                <div class="floating-card card-emoji">😂</div>
                <div class="floating-card card-story">
                    <div class="story-img"></div>
                </div>
                <div class="floating-card card-post">
                    <div class="post-header"></div>
                </div>
            </div>
        </div>

        <!-- Right Side: Login Box -->
        <div class="right-section">
            <div class="login-box">
                <h2>Log in to Facebook</h2>

                <form action="#" method="POST">
                    <div class="input-group">
                        <input type="text" placeholder="Email address or mobile number" required>
                    </div>

                    <div class="input-group">
                        <input type="password" placeholder="Password" required>
                    </div>

                    <button type="submit" class="login-btn">Log in</button>
                </form>

                <a href="#" class="forgot-link">Forgotten password?</a>

                <hr class="divider">

                <div class="create-account-container">
                    <button type="button" class="create-btn">Create new account</button>
                </div>

                <div class="meta-footer">
                    <span>∞ Meta</span>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
