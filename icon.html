<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Your Social Media</title>
    <!-- Tailwind CSS for modern base layout styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&display=swap');

        body {
            background-color: #121212;
            font-family: 'Teko', sans-serif;
            letter-spacing: 0.05em;
        }

        /* Banner Container */
        .social-banner {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
            max-width: 550px;
            height: 90px;
            margin: 20px 0;
            background: transparent;
        }

        /* White Bar Background */
        .banner-bar {
            position: absolute;
            left: 45px; /* Offset so it tucks nicely behind the circle */
            right: 0;
            height: 70px;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-left: 55px;
            padding-right: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            z-index: 1;
        }

        /* Right colored tab */
        .banner-tab {
            width: 25px;
            height: 50px;
            border-radius: 4px;
            position: absolute;
            right: -10px;
            z-index: 2;
        }

        /* Circular Icon with Hover Slide Animation */
        .banner-icon-wrapper {
            position: absolute;
            left: 0;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 3;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            border: 4px solid #ffffff;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Hover animation: slide to the right */
        .social-banner:hover .banner-icon-wrapper {
            transform: translateX(430px);
        }

        /* Long shadow effect simulation using stacked linear gradients or layered shadows */
        .icon-shadow-fb {
            background: radial-gradient(circle, #1877f2 60%, #0d47a1 100%);
        }
        .icon-shadow-ig {
            background: radial-gradient(circle, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
        }
        .icon-shadow-yt {
            background: radial-gradient(circle, #ff0000 60%, #b71c1c 100%);
        }
        .icon-shadow-tw {
            background: radial-gradient(circle, #1da1f2 60%, #0d8ecf 100%);
        }

        /* Typography styling */
        .banner-text {
            font-size: 2.2rem;
            font-weight: 600;
            line-height: 1;
            margin-top: 5px;
        }

        /* Platform specific colors */
        .text-fb { color: #1877f2; }
        .bg-fb { background-color: #0d47a1; }

        .text-ig { color: #dc2743; }
        .bg-ig { background-color: #dc2743; }

        .text-yt { color: #ff0000; }
        .bg-yt { background-color: #cc0000; }

        .text-tw { color: #1da1f2; }
        .bg-tw { background-color: #1da1f2; }
    </style>
    <link rel="stylesheet" href="theme.css">
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6">

    <div class="w-full max-w-xl flex flex-col gap-6 items-center">
        <h1 class="text-white text-3xl font-bold tracking-wider mb-2">Secure Your Social Media Banners</h1>

        <!-- Facebook Banner -->
        <div class="social-banner">
            <div class="banner-bar">
                <span class="banner-text text-fb">/Facebook</span>
                <div class="banner-tab bg-fb"></div>
            </div>
            <div class="banner-icon-wrapper icon-shadow-fb">
                <svg class="w-10 h-10 text-white fill-current" viewBox="0 0 24 24">
                    <path d="M9 8H6v4h3v12h5V12h3.642L18 8h-4V6.333C14 5.375 14.5 5 15.5 5H18V0h-3.808C10.59 0 9 1.581 9 4.615V8z"/>
                </svg>
            </div>
        </div>

        <!-- Instagram Banner -->
        <div class="social-banner">
            <div class="banner-bar">
                <span class="banner-text text-ig">/Instagram</span>
                <div class="banner-tab bg-ig"></div>
            </div>
            <div class="banner-icon-wrapper icon-shadow-ig">

                </svg>
            </div>
        </div>

        <!-- YouTube Banner -->
        <div class="social-banner">
            <div class="banner-bar">
                <span class="banner-text text-yt">/youTube</span>
                <div class="banner-tab bg-yt"></div>
            </div>
            <div class="banner-icon-wrapper icon-shadow-yt">
                <svg class="w-10 h-10 text-white fill-current" viewBox="0 0 24 24">
                    <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
                </svg>
            </div>
        </div>

        <!-- Twitter / X Banner -->
        <div class="social-banner">
            <div class="banner-bar">
                <span class="banner-text text-tw">/X</span>
                <div class="banner-tab bg-tw"></div>
            </div>
            <div class="banner-icon-wrapper icon-shadow-tw">
                <svg class="w-10 h-10 text-white fill-current" viewBox="0 0 24 24">
                    <path d="M24 4.557c-.883.392-1.832.656-2.828.775 1.017-.609 1.798-1.574 2.165-2.724-.951.564-2.005.974-3.127 1.195-.897-.957-2.178-1.555-3.594-1.555-3.179 0-5.515 2.966-4.797 6.045-4.091-.205-7.719-2.165-10.148-5.144-1.29 2.213-.669 5.108 1.523 6.574-.806-.026-1.566-.247-2.229-.616-.054 2.281 1.581 4.415 3.949 4.89-.693.188-1.452.232-2.224.084.626 1.956 2.444 3.379 4.6 3.419-2.07 1.623-4.678 2.348-7.29 2.04 2.179 1.397 4.768 2.212 7.548 2.212 9.142 0 14.307-7.721 13.995-14.646.962-.695 1.797-1.562 2.457-2.549z"/>
                </svg>
            </div>
        </div>

    </div>

</body>
</html>
