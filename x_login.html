<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Happening now</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      background: 
        linear-gradient(135deg, #0d2538 0%, #0d2538 35%, transparent 35.2%),
        radial-gradient(circle at 90% 80%, rgba(196, 161, 95, 0.25), transparent 50%),
        #050505;
      color: #f3f1ed;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-container {
      width: 100%;
      max-width: 380px;
    }

    h1 {
      font-size: 3.2rem;
      font-weight: 800;
      line-height: 1.05;
      margin-bottom: 32px;
      letter-spacing: -0.02em;
    }

    .oauth-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .btn-oauth {
      width: 100%;
      height: 50px;
      background-color: #c5a358;
      color: #0b0b0b;
      border: none;
      border-radius: 999px;
      font-size: 0.95rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .btn-oauth:hover {
      background-color: #d4b46a;
    }

    .btn-oauth:active {
      transform: scale(0.99);
    }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      color: #a09c95;
      font-size: 0.85rem;
      margin: 20px 0;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      border-bottom: 1px solid rgba(197, 163, 88, 0.3);
    }

    .divider span {
      padding: 0 12px;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .input-field {
      width: 100%;
      height: 50px;
      padding: 0 18px;
      background-color: rgba(10, 10, 10, 0.8);
      border: 1px solid rgba(197, 163, 88, 0.6);
      border-radius: 10px;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .input-field::placeholder {
      color: #b5b0a8;
    }

    .input-field:focus {
      border-color: #c5a358;
    }

    .form-helpers {
      display: flex;
      justify-content: flex-end;
      margin-top: -6px;
    }

    .form-helpers a {
      color: #c5a358;
      font-size: 0.82rem;
      text-decoration: none;
    }

    .form-helpers a:hover {
      text-decoration: underline;
    }

    .btn-submit {
      width: 100%;
      height: 50px;
      background-color: #0e293d;
      color: #ffffff;
      border: 1px solid rgba(197, 163, 88, 0.5);
      border-radius: 999px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn-submit:hover {
      background-color: #163b57;
    }

    .legal-text {
      margin-top: 16px;
      font-size: 0.78rem;
      line-height: 1.5;
      color: #a09c95;
    }

    .legal-text a {
      color: #f3f1ed;
      font-weight: 600;
      text-decoration: none;
    }

    .legal-text a:hover {
      text-decoration: underline;
    }

    .signup-prompt {
      margin-top: 28px;
      font-size: 0.9rem;
      color: #b5b0a8;
    }

    .signup-prompt a {
      color: #c5a358;
      font-weight: 600;
      text-decoration: none;
    }

    .signup-prompt a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <main class="login-container">
    <h1>Happening<br>now.</h1>

    <div class="oauth-group">
      <button type="button" class="btn-oauth">
        <span>📞</span> Continue with phone
      </button>
      <button type="button" class="btn-oauth">
        <span>G</span> Continue with Google
      </button>
      <button type="button" class="btn-oauth">
        <span></span> Continue with Apple
      </button>
    </div>

    <div class="divider"><span>or</span></div>

    <form class="login-form" action="/login" method="POST">
      <input 
        type="text" 
        name="identifier" 
        class="input-field" 
        placeholder="Email or username" 
        required 
      />
      <input 
        type="password" 
        name="password" 
        class="input-field" 
        placeholder="Password" 
        required 
      />
      
      <div class="form-helpers">
        <a href="/forgot-password">Forgot password?</a>
      </div>

      <button type="submit" class="btn-submit">Continue</button>
    </form>

    <p class="legal-text">
      By continuing, you agree to our <a href="/terms">Terms of Service</a>, 
      <a href="/privacy">Privacy Policy</a> and <a href="/cookies">Cookie Use</a>.
    </p>

    <p class="signup-prompt">
      Don't have an account? <a href="/register">Sign up</a>
    </p>
  </main>

</body>
</html>
